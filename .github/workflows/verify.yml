name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-cartelera-personal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mi-cartelera-personal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
